<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة نموذج الانخراط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background: #1A1A1A; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #2D2D2D; padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; border: 2px solid #E91E63; }
        .input-field { background: #404040; border: 1px solid #E91E63; color: white; padding: 12px; border-radius: 8px; width: 100%; margin-top: 5px; }
        .btn { background: #E91E63; color: white; padding: 12px; border-radius: 8px; width: 100%; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn:hover { background: #C2185B; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #pdfTemplate { position: absolute; left: -9999px; background: white; color: black; padding: 40px; width: 800px; font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="text-2xl font-bold text-center text-pink-500 mb-6">تجربة نموذج الانخراط</h1>
        
        <!-- الخطوة 1 -->
        <div id="step1" class="step active">
            <h2 class="text-xl mb-4">الخطوة 1: الاسم</h2>
            <label>الاسم الكامل</label>
            <input type="text" id="fullname" class="input-field" placeholder="أدخل اسمك">
            <button class="btn" onclick="nextStep(2)">التالي</button>
        </div>

        <!-- الخطوة 2 -->
        <div id="step2" class="step">
            <h2 class="text-xl mb-4">الخطوة 2: الهاتف</h2>
            <label>رقم الهاتف</label>
            <input type="tel" id="phone" class="input-field" placeholder="06XXXXXXXX">
            <div class="flex gap-2 mt-4">
                <button class="btn" style="background: #555;" onclick="nextStep(1)">السابق</button>
                <button class="btn" onclick="nextStep(3)">التالي</button>
            </div the>
        </div>

        <!-- الخطوة 3: النجاح و PDF -->
        <div id="step3" class="step text-center">
            <h2 class="text-2xl text-green-400 mb-4">✅ تم التسجيل بنجاح!</h2>
            <p class="mb-6">تم حفظ البيانات (محاكاة) وهو جاهز للتحميل.</p>
            <button class="btn" style="background: #10B981;" onclick="generatePDF()">📥 تحميل نسخة PDF</button>
            <button class="btn" style="background: #555; margin-top: 10px;" onclick="location.reload()">بدء من جديد</button>
        </div>
    </div>

    <!-- قالب الـ PDF المخفي -->
    <div id="pdfTemplate">
        <h1 style="color: #E91E63; text-align: center; font-size: 28px;">حزب الاستقلال</h1>
        <p style="text-align: center; color: #666;">استمارة انخراط تجريبية</p>
        <hr style="margin: 20px 0; border-color: #E91E63;">
        <p><strong>الاسم:</strong> <span id="pdfName"></span></p>
        <p><strong>الهاتف:</strong> <span id="pdfPhone"></span></p>
        <br>
        <div style="text-align: center; margin-top: 50px; border-top: 1px solid #ccc; padding-top: 20px;">
            <p style="color: #666; font-size: 14px;">تم التصميم بواسطة</p>
            <p style="color: #E91E63; font-size: 18px; font-weight: bold;">محمد الفلاق</p>
        </div>
    </div>

    <script>
        let formData = {};

        function nextStep(step) {
            // حفظ البيانات
            if(document.getElementById('fullname').value) formData.name = document.getElementById('fullname').value;
            if(document.getElementById('phone').value) formData.phone = document.getElementById('phone').value;

            // التحقق البسيط
            if (step === 2 && !formData.name) { alert('يرجى إدخال الاسم'); return; }
            if (step === 3 && !formData.phone) { alert('يرجى إدخال الهاتف'); return; }

            // إخفاء كل الخطوات وإظهار المطلوبة
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');

            // إذا وصلنا للنهاية، نجهز بيانات الـ PDF
            if (step === 3) {
                document.getElementById('pdfName').textContent = formData.name;
                document.getElementById('pdfPhone').textContent = formData.phone;
            }
        }

        async function generatePDF() {
            const btn = document.querySelector('#step3 .btn');
            btn.textContent = 'جاري الإنشاء...';
            
            try {
                const element = document.getElementById('pdfTemplate');
                const canvas = await html2canvas(element, { scale: 2 });
                const imgData = canvas.toDataURL('image/png');
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save(`تسجيل_${formData.name || 'جديد'}.pdf`);
                
                btn.textContent = '✅ تم التحميل بنجاح';
                setTimeout(() => btn.textContent = '📥 تحميل نسخة PDF', 3000);
            } catch (err) {
                alert('حدث خطأ: ' + err.message);
                btn.textContent = '📥 تحميل نسخة PDF';
            }
        }
    </script>
</body>
</html>
