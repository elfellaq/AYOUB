<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztVOBbJoNuG1IQn5Nee3g3YVUdHrUBgjLQ6rHc4LoMeQEl6AAhi03WTOMfvwRhdQA/exec';

    const form = document.getElementById('membershipForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    
    document.getElementById('dob').max = new Date().toISOString().split("T")[0];

    const communesData = {
        "وادي الذهب": ["الداخلة", "العركوب", "إمليلي", "بئر إنزران", "أم ادريكة", "قليبات الفولة", "ميجك"],
        "أوسرد": ["الكويرة", "أوسرد", "بئر كندوز", "تيشلا", "أغوينيت", "الزوك"]
    };

    const provinceSelect = document.getElementById('province');
    const communeSelect = document.getElementById('commune');

    provinceSelect.addEventListener('change', function() {
        const selectedProvince = this.value;
        communeSelect.innerHTML = '<option value="" disabled selected>اختر الجماعة</option>';
        
        if (communesData[selectedProvince]) {
            communesData[selectedProvince].forEach(commune => {
                const option = document.createElement('option');
                option.value = commune;
                option.textContent = commune;
                communeSelect.appendChild(option);
            });
            communeSelect.disabled = false;
        } else {
            communeSelect.disabled = true;
        }
    });

    function validateField(field, condition) {
        const group = field.closest('.form-group');
        if (!group) return true;
        if (condition) {
            group.classList.remove('error');
            group.classList.add('success');
            return true;
        } else {
            group.classList.remove('success');
            group.classList.add('error');
            return false;
        }
    }

    // التحقق الفوري
    document.getElementById('fullname').addEventListener('input', (e) => validateField(e.target, e.target.value.trim().length >= 3));
    document.getElementById('phone').addEventListener('input', (e) => validateField(e.target, /^[\d\s\+\-]{8,15}$/.test(e.target.value)));
    document.getElementById('email').addEventListener('input', (e) => validateField(e.target, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value)));
    document.getElementById('dob').addEventListener('change', (e) => validateField(e.target, e.target.value !== ''));
    provinceSelect.addEventListener('change', (e) => validateField(e.target, e.target.value !== ''));
    communeSelect.addEventListener('change', (e) => validateField(e.target, e.target.value !== ''));
    document.getElementById('address').addEventListener('input', (e) => validateField(e.target, e.target.value.trim().length >= 5));

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        let isValid = true;
        isValid = validateField(document.getElementById('fullname'), document.getElementById('fullname').value.trim().length >= 3) && isValid;
        isValid = validateField(document.getElementById('phone'), /^[\d\s\+\-]{8,15}$/.test(document.getElementById('phone').value)) && isValid;
        isValid = validateField(document.getElementById('email'), /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value)) && isValid;
        isValid = validateField(document.getElementById('dob'), document.getElementById('dob').value !== '') && isValid;
        isValid = validateField(provinceSelect, provinceSelect.value !== '') && isValid;
        isValid = validateField(communeSelect, communeSelect.value !== '') && isValid;
        isValid = validateField(document.getElementById('address'), document.getElementById('address').value.trim().length >= 5) && isValid;

        if (!isValid) {
            const firstError = document.querySelector('.form-group.error');
            if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        const selectedLangs = [];
        document.querySelectorAll('.lang-option input:checked').forEach(cb => selectedLangs.push(cb.value));

        // تجهيز البيانات للإرسال
        const formData = {
            fullname: document.getElementById('fullname').value.trim(),
            email: document.getElementById('email').value.trim(),
            dob: document.getElementById('dob').value,
            phone: document.getElementById('phone').value.trim(),
            province: provinceSelect.value,
            commune: communeSelect.value,
            address: document.getElementById('address').value.trim(),
            education: document.getElementById('education').value,
            workStatus: document.getElementById('workStatus').value,
            profession: document.getElementById('profession').value.trim(),
            languages: selectedLangs.join(', ') || 'غير محدد',
            expertise: document.getElementById('expertise').value.trim()
        };

        // حالة التحميل
        submitBtn.disabled = true;
        btnText.textContent = 'جاري الإرسال...';
        btnIcon.outerHTML = '<span class="spinner"></span>';

        try {
            // طريقة الإرسال المضمونة مع Google Apps Script
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                // لا نضع Content-Type يدوياً لترك المتصفح يتعامل معها كـ text/plain وتجنب مشاكل CORS
                body: JSON.stringify(formData)
            });

            // لأننا نستخدم no-cors ضمناً أو نتعامل مع Redirect، نعتبر النجاح هو عدم وجود استثناء
            setTimeout(() => {
                form.style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                form.reset(); // تفريغ النموذج
            }, 1500);

        } catch (error) {
            console.error('Error:', error);
            submitBtn.disabled = false;
            btnText.textContent = 'إرسال طلب الانخراط';
            btnIcon.outerHTML = '<i class="fas fa-paper-plane" id="btnIcon"></i>';
            
            form.style.display = 'none';
            document.getElementById('errorText').textContent = 'تأكد من اتصالك بالإنترنت، أو أن رابط السكربت صحيح.';
            document.getElementById('errorAlert').style.display = 'block';
        }
    });
</script>
